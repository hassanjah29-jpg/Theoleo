<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAND — Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #13161c; --panel: #181c24; --card: #191e27; --line: #272c36;
    --ink: #ecebe6; --ink-soft: #b3b1a8; --ink-faint: #807d74;
    --accent: #2ea27c; --accent-light: #4cc39a; --accent-soft: #1b352c;
    --radius: 6px; color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Inter", -apple-system, sans-serif;
    font-size: 15px; line-height: 1.6;
    background: var(--paper); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Fraunces", Georgia, serif; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; }

  /* ---- Login ---- */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
  .login-card {
    width: min(400px, 94vw); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 2.5rem;
  }
  .login-card .logo { font-family: "Fraunces", serif; font-weight: 700; font-size: 1.7rem; }
  .login-card .logo span { color: var(--accent); }
  .login-card p { color: var(--ink-soft); font-size: 0.9rem; margin: 0.5rem 0 1.5rem; }
  .login-card input {
    width: 100%; font: inherit; padding: 0.8rem 1rem; border-radius: var(--radius);
    border: 1.5px solid var(--line); background: #12151b; color: var(--ink);
  }
  .login-card input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .login-error { color: #e08f8f; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em; }

  .btn {
    display: inline-block; border: none; border-radius: var(--radius);
    padding: 0.75rem 1.4rem; font-weight: 600; font-size: 0.9rem;
    background: var(--accent); color: #fff; transition: background 0.15s ease;
  }
  .btn:hover { background: var(--accent-light); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--ink-faint); background: transparent; }
  .btn.small { padding: 0.35rem 0.75rem; font-size: 0.78rem; }
  .btn.danger { background: transparent; border: 1px solid #5a3030; color: #d09090; }
  .btn.danger:hover { background: #2a1a1a; }
  .btn[disabled] { opacity: 0.5; cursor: default; }

  /* ---- App shell ---- */
  .app { display: none; min-height: 100vh; }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: 0.85rem clamp(1rem, 3vw, 2rem);
    background: rgba(19, 22, 28, 0.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .logo { font-family: "Fraunces", serif; font-weight: 700; font-size: 1.2rem; }
  .topbar .logo span { color: var(--accent); }
  .topbar .who { color: var(--ink-faint); font-size: 0.82rem; }
  .topbar .spacer { flex: 1; }
  .dirty-dot { display: none; color: #e3b341; font-size: 0.82rem; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 220px 1fr; gap: 0; }
  @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

  .sidebar { border-right: 1px solid var(--line); padding: 1.25rem 0.75rem; }
  @media (max-width: 820px) {
    .sidebar { display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); gap: 0.25rem; }
  }
  .sidebar button {
    display: block; width: 100%; text-align: left; white-space: nowrap;
    background: none; border: none; color: var(--ink-soft);
    padding: 0.6rem 0.9rem; border-radius: var(--radius); font-size: 0.9rem; font-weight: 500;
  }
  .sidebar button:hover { color: var(--ink); background: var(--panel); }
  .sidebar button.current { color: var(--ink); background: var(--accent-soft); font-weight: 600; }

  .editor { padding: clamp(1.25rem, 3vw, 2.5rem); max-width: 860px; padding-bottom: 7rem; }
  .editor h2 { font-size: 1.6rem; margin-bottom: 0.35rem; }
  .editor .hint { color: var(--ink-faint); font-size: 0.85rem; margin-bottom: 1.75rem; }

  .field { margin-bottom: 1.2rem; }
  .field > label {
    display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--ink-faint); margin-bottom: 0.4rem;
  }
  .field input[type=text], .field textarea {
    width: 100%; font: inherit; font-size: 0.92rem; color: var(--ink);
    background: #12151b; border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 0.65rem 0.85rem; resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }

  fieldset.group { border: 1px solid var(--line); border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
  fieldset.group > legend { padding: 0 0.5rem; font-size: 0.8rem; font-weight: 600; color: var(--accent-light); letter-spacing: 0.06em; text-transform: uppercase; }

  .arr-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1.1rem 0.6rem; margin-bottom: 0.9rem; position: relative; }
  .arr-item .arr-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; }
  .arr-item .arr-head .n { font-size: 0.75rem; font-weight: 700; color: var(--ink-faint); letter-spacing: 0.08em; }
  .arr-tools { margin: -0.25rem 0 1.5rem; }

  .savebar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 1rem;
    padding: 0.85rem clamp(1rem, 3vw, 2rem);
    background: rgba(13, 16, 21, 0.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .savebar .status { color: var(--ink-faint); font-size: 0.85rem; flex: 1; }
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-light);
    border-radius: var(--radius); padding: 0.7rem 1.3rem; font-weight: 600; font-size: 0.9rem;
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s ease; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: #2a1a1a; border-color: #5a3030; color: #d09090; }
</style>
</head>
<body>

<div class="login-wrap" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="logo">HAND<span>.</span> Admin</div>
    <p>Enter your password to edit the website.</p>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>
    <div class="login-error" id="loginError"></div>
    <button class="btn" type="submit" style="width:100%;margin-top:0.5rem;">Sign in</button>
  </form>
</div>

<div class="app" id="appView">
  <div class="topbar">
    <span class="logo">HAND<span>.</span> Admin</span>
    <span class="who" id="who"></span>
    <span class="dirty-dot" id="dirty">● Unsaved changes</span>
    <span class="spacer"></span>
    <a class="btn ghost small" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn ghost small" id="logout" type="button">Sign out</button>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Content sections"></nav>
    <main class="editor" id="editor"></main>
  </div>
  <div class="savebar">
    <span class="status" id="status">Edit any field, then save. Changes appear on the live site immediately after refresh.</span>
    <button class="btn ghost" id="discard" type="button">Discard changes</button>
    <button class="btn" id="save" type="button">Save changes</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var state = null;       // working copy
  var savedJSON = "";     // last-saved serialization
  var currentTab = null;

  var SECTION_META = {
    site:     ["Site & Contact", "Email, phone, and footer text shown on every page."],
    shared:   ["Commitments", "The four written promises (shown on Home and Approach)."],
    home:     ["Home page", "Hero, problem, statement, services, case study, report mockup, process, testimonials."],
    services: ["Services page", "The five service sections and closing call-to-action."],
    work:     ["Work page", "The three case studies, including every stat."],
    approach: ["Approach page", "The orbital diagram, the seven Method stages, and fit lists."],
    about:    ["About page", "Story, values, team, and the four stats."],
    audit:    ["Audit page", "The free-audit offer, checklist, and testimonials."],
    contact:  ["Contact page", "Hero copy and the sidebar testimonial."],
    faq:      ["FAQ page", "Add, remove, or rewrite questions freely."]
  };

  function $(id) { return document.getElementById(id); }

  function humanize(key) {
    return key
      .replace(/([a-z])([A-Z])/g, "$1 $2")
      .replace(/[_-]/g, " ")
      .replace(/^./, function (c) { return c.toUpperCase(); });
  }

  function toast(msg, err) {
    var el = $("toast");
    el.textContent = msg;
    el.className = "toast show" + (err ? " err" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.className = "toast"; }, 2600);
  }

  function setDirty() {
    $("dirty").style.display = JSON.stringify(state) !== savedJSON ? "inline" : "none";
  }

  /* ---- path get/set on state ---- */
  function getAt(path) {
    return path.reduce(function (o, k) { return o[k]; }, state);
  }
  function setAt(path, value) {
    var parent = path.slice(0, -1).reduce(function (o, k) { return o[k]; }, state);
    parent[path[path.length - 1]] = value;
    setDirty();
  }

  /* ---- recursive form renderer ---- */
  function renderValue(container, path, key, value) {
    if (typeof value === "string") {
      var field = document.createElement("div");
      field.className = "field";
      var label = document.createElement("label");
      label.textContent = humanize(String(key));
      field.appendChild(label);
      var long = value.length > 90 || value.indexOf("\n") !== -1;
      var input = document.createElement(long ? "textarea" : "input");
      if (long) input.rows = Math.min(8, Math.max(2, Math.ceil(value.length / 80)));
      else input.type = "text";
      input.value = value;
      input.addEventListener("input", function () { setAt(path, input.value); });
      field.appendChild(input);
      container.appendChild(field);
    } else if (Array.isArray(value)) {
      var fs = document.createElement("fieldset");
      fs.className = "group";
      var legend = document.createElement("legend");
      legend.textContent = humanize(String(key));
      fs.appendChild(legend);
      value.forEach(function (item, i) {
        var wrap = document.createElement("div");
        wrap.className = "arr-item";
        var head = document.createElement("div");
        head.className = "arr-head";
        var n = document.createElement("span");
        n.className = "n";
        n.textContent = "#" + (i + 1);
        var del = document.createElement("button");
        del.type = "button";
        del.className = "btn danger small";
        del.textContent = "Remove";
        del.addEventListener("click", function () {
          var arr = getAt(path);
          arr.splice(i, 1);
          setDirty();
          renderTab(currentTab);
        });
        head.appendChild(n);
        head.appendChild(del);
        wrap.appendChild(head);
        if (typeof item === "string") {
          renderValue(wrap, path.concat(i), "text", item);
        } else {
          Object.keys(item).forEach(function (k) {
            renderValue(wrap, path.concat(i, k), k, item[k]);
          });
        }
        fs.appendChild(wrap);
      });
      var tools = document.createElement("div");
      tools.className = "arr-tools";
      var add = document.createElement("button");
      add.type = "button";
      add.className = "btn ghost small";
      add.textContent = "+ Add item";
      add.addEventListener("click", function () {
        var arr = getAt(path);
        var template;
        if (arr.length && typeof arr[arr.length - 1] === "object") {
          template = {};
          Object.keys(arr[arr.length - 1]).forEach(function (k) { template[k] = ""; });
        } else {
          template = "";
        }
        arr.push(template);
        setDirty();
        renderTab(currentTab);
      });
      tools.appendChild(add);
      fs.appendChild(tools);
      container.appendChild(fs);
    } else if (value && typeof value === "object") {
      var fso = document.createElement("fieldset");
      fso.className = "group";
      var lg = document.createElement("legend");
      lg.textContent = humanize(String(key));
      fso.appendChild(lg);
      Object.keys(value).forEach(function (k) {
        renderValue(fso, path.concat(k), k, value[k]);
      });
      container.appendChild(fso);
    }
  }

  function renderTab(tab) {
    currentTab = tab;
    var meta = SECTION_META[tab] || [humanize(tab), ""];
    var editor = $("editor");
    editor.innerHTML = "";
    var h = document.createElement("h2");
    h.textContent = meta[0];
    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = meta[1];
    editor.appendChild(h);
    editor.appendChild(hint);
    var section = state[tab];
    Object.keys(section).forEach(function (k) {
      renderValue(editor, [tab, k], k, section[k]);
    });
    document.querySelectorAll(".sidebar button").forEach(function (b) {
      b.classList.toggle("current", b.dataset.tab === tab);
    });
  }

  function renderSidebar() {
    var bar = $("sidebar");
    bar.innerHTML = "";
    Object.keys(state).forEach(function (key) {
      var b = document.createElement("button");
      b.type = "button";
      b.dataset.tab = key;
      b.textContent = (SECTION_META[key] || [humanize(key)])[0];
      b.addEventListener("click", function () { renderTab(key); });
      bar.appendChild(b);
    });
  }

  /* ---- data flow ---- */
  function loadContent() {
    return fetch("/api/content").then(function (r) { return r.json(); }).then(function (data) {
      state = data;
      savedJSON = JSON.stringify(state);
      renderSidebar();
      renderTab(Object.keys(state)[0]);
      setDirty();
    });
  }

  function showApp(user) {
    $("loginView").style.display = "none";
    $("appView").style.display = "block";
    $("who").textContent = "signed in as " + user;
    loadContent();
  }

  /* ---- events ---- */
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("loginError").textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("password").value })
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) showApp(res.j.user);
        else $("loginError").textContent = res.j.error || "Sign-in failed.";
      })
      .catch(function () { $("loginError").textContent = "Could not reach the server."; });
  });

  $("logout").addEventListener("click", function () {
    fetch("/api/logout", { method: "POST" }).then(function () { location.reload(); });
  });

  $("save").addEventListener("click", function () {
    var btn = $("save");
    btn.disabled = true;
    fetch("/api/content", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state)
    }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        btn.disabled = false;
        if (res.ok) {
          savedJSON = JSON.stringify(state);
          setDirty();
          toast("Saved. Refresh the site to see your changes.");
          $("status").textContent = "Last saved " + new Date().toLocaleTimeString() + " by " + res.j.savedBy + ".";
        } else {
          toast(res.j.error || "Save failed.", true);
        }
      })
      .catch(function () { btn.disabled = false; toast("Could not reach the server.", true); });
  });

  $("discard").addEventListener("click", function () {
    if (JSON.stringify(state) !== savedJSON && !confirm("Throw away your unsaved changes?")) return;
    loadContent().then(function () { toast("Reverted to last saved version."); });
  });

  window.addEventListener("beforeunload", function (e) {
    if (state && JSON.stringify(state) !== savedJSON) { e.preventDefault(); e.returnValue = ""; }
  });

  /* ---- boot ---- */
  fetch("/api/session").then(function (r) {
    if (r.ok) r.json().then(function (j) { showApp(j.user); });
  });
})();
</script>
</body>
</html>
