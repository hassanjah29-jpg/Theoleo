<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Second Scoop</title>
  <meta name="description" content="Get in touch with Second Scoop. Questions about orders, pickup, collaborations or wholesale — reach us by email, WhatsApp or Instagram.">
  <meta property="og:title" content="Contact — Second Scoop">
  <meta property="og:description" content="Questions, collabs or wholesale? Reach the Second Scoop team.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='16' fill='%23C8843E'/%3E%3Ccircle cx='14' cy='16' r='2.5' fill='%233A2114'/%3E%3Ccircle cx='25' cy='15' r='3' fill='%233A2114'/%3E%3Ccircle cx='23' cy='25' r='2.2' fill='%233A2114'/%3E%3Ccircle cx='15' cy='26' r='2' fill='%233A2114'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
  <div id="ss-top"></div>

  <main>
    <!-- ===================== PAGE HEAD ===================== -->
    <header class="page-head wrap">
      <span class="eyebrow center-eyebrow">Say Hi</span>
      <h1>Let's Talk Scoops.</h1>
      <p>Orders, pickup, collaborations, wholesale or just to tell us your second scoop hit different — we're listening.</p>
    </header>

    <!-- ===================== CONTACT GRID ===================== -->
    <section class="section" style="padding-top:1rem">
      <div class="wrap">
        <div class="contact-grid reveal">

          <!-- Left: contact details (#ci-rows filled from config.brand) -->
          <div class="contact-info">
            <h2 style="font-size:1.4rem;margin-bottom:.4rem">Reach us directly</h2>
            <div id="ci-rows"></div>
          </div>

          <!-- Right: message form (app.js initForms handles success) -->
          <div>
            <form id="contact-form">
              <div class="form-row">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">
                  <div class="field"><label for="ct-name">Name</label><input class="input" id="ct-name" type="text" placeholder="Your name" required></div>
                  <div class="field"><label for="ct-email">Email</label><input class="input" id="ct-email" type="email" placeholder="you@email.com" required></div>
                </div>
                <div class="field"><label for="ct-subject">Subject</label><input class="input" id="ct-subject" type="text" placeholder="What's this about?" required></div>
                <div class="field"><label for="ct-msg">Message</label><textarea class="input" id="ct-msg" rows="5" placeholder="Tell us everything…" required></textarea></div>
                <button class="btn btn-primary btn-block" type="submit">Send Message 🍪</button>
                <div class="form-success" id="contact-success"></div>
              </div>
            </form>
          </div>

        </div>
      </div>
    </section>
  </main>

  <div id="ss-bottom"></div>

  <!-- config.js defines SS_CONFIG; app.js (buildContactRows) fills #ci-rows -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
